<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leet Blind</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img src="images/icon-32.png" alt="Leet Blind Logo"/>
    <span class="title">Leet Blind</span>
      <label class="switch">
        <input type="checkbox" id="extensionToggle" checked>
        <span class="slider"></span>
      </label>
  </div>

  <!-- Mode -->
  <div class="section">
    <div class="section-label">Mode</div>
    <div class="mode-row">
      <button class="mode-btn active" id="btn-hide" data-value="hide">Hide difficulty</button>
      <button class="mode-btn" id="btn-randomize" data-value="randomize">Randomize</button>
    </div>
  </div>

  <!-- Weights -->
  <div class="section">
    <div class="section-label">Weights</div>

    <div class="slider-row">
      <div class="slider-meta">
        <div class="diff-label"><span class="dot dot-easy"></span>Easy</div>
        <span class="pct" id="easyValue">40%</span>
      </div>
      <input type="range" min="0" max="100" step="1" value="40" id="easySlider" />
    </div>

    <div class="slider-row">
      <div class="slider-meta">
        <div class="diff-label"><span class="dot dot-medium"></span>Medium</div>
        <span class="pct" id="mediumValue">40%</span>
      </div>
      <input type="range" min="0" max="100" step="1" value="40" id="mediumSlider" />
    </div>

    <div class="slider-row">
      <div class="slider-meta">
        <div class="diff-label"><span class="dot dot-hard"></span>Hard</div>
        <span class="pct" id="hardValue">20%</span>
      </div>
      <input type="range" min="0" max="100" step="1" value="20" id="hardSlider" />
    </div>

    <div class="total" id="totalLine">Total: <span id="totalText">100%</span></div>
  </div>

  <!-- Save -->
  <button class="save-btn" id="saveBtn">Save settings</button>

  <script src="popup.js"></script>

</body>
</html>
